<style>
* { box-sizing: border-box; }

.t2 { border-color: #6a1b9a; } .t2 .dh { background: #6a1b9a; } .t2 .avg { color: #6a1b9a; }
.t3 { border-color: #00695c; } .t3 .dh { background: #00695c; } .t3 .avg { color: #00695c; }

#modal { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 10; display: none; align-items: center; justify-content: center; padding: 18px; }

<div id="hdr"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="10" fill="#fff"/><polyline points="6,26 15,26 20,12 28,38 33,26 42,26" fill="none" stroke="#0b2a6f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="t">Vitals Log</div><div class="d" id="hdate"></div></div></div>
<div id="app"></div>

<input type="file" id="import-file" accept=".json,application/json" style="display:none">

<script>
(function () {
'use strict';

var KEY = 'vitalsLog.v1';
var PREV = 'vitalsLog.prev';
var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var DOWFULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

var state = null;
var loadError = '';
var view = 'log';
var flashMsg = '';
var editReadingId = null;
var editMedId = null;
var editWeightId = null;
var todayDate = null;
var reportRange = '30';
var pendingConfirm = null;

/* ---------- small helpers (local time only) ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return fmtDate(new Date()); }
function nowTime() { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function parseDate(s) { var p = s.split('-'); return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)); }
function addDays(s, n) { var d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
function longDate(s) { var d = parseDate(s); return DOW[d.getDay()] + ' ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function shortDate(s) { var d = parseDate(s); return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function periodFor(t) {
  if (!t) { return 'AM'; }
  return parseInt(t.split(':')[0], 10) < 12 ? 'AM' : 'PM';
}
function hm(min) { return Math.floor(min / 60) + ':' + pad2(min % 60); }
function readInt(v) {
  v = String(v).replace(/^\s+|\s+$/g, '');
  if (!/^\d{1,3}$/.test(v)) { return null; }
  var n = parseInt(v, 10);
  return n >= 1 ? n : null;
}
function newId(prefix) { return prefix + Date.now() + Math.floor(Math.random() * 1000); }

/* ---------- data ---------- */
function seed() {
  /* No personal data lives in this public file. Start empty; load a backup with Backup > Import. */
  return { version: 1, profile: { name: '' }, readings: [], weights: [], days: {}, meds: [] };
}

function validState(o) {
  return !!o && typeof o === 'object' && o.readings instanceof Array && o.meds instanceof Array &&
    !!o.days && typeof o.days === 'object' && !(o.days instanceof Array);
}

function load() {
  var raw = null;
  try {
    raw = localStorage.getItem(KEY);
  } catch (e) {
    loadError = 'This browser is blocking storage, so the app cannot save anything. Nothing was changed.';
    state = null;
    return;
  }
  if (raw === null) {
    /* first run only: nothing saved yet, so loading the starting data cannot overwrite anything */
    state = seed();
    save();
    return;
  }
  try {
    var obj = JSON.parse(raw);
    if (!validState(obj)) { throw new Error('bad shape'); }
    if (!obj.profile) { obj.profile = { name: '' }; }
    if (!(obj.weights instanceof Array)) { obj.weights = []; } /* older saves have no weights yet */
    state = obj;
  } catch (e2) {
    loadError = 'The saved data could not be read. The app has NOT changed or erased it. Use the button below to save a copy of it, then ask for help.';
    state = null;
  }
}

function save() {
  if (!state) { return false; }
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    setErr('Could not save to this phone. Free up space or check browser storage settings.');
    return false;
  }
  haPing();
  return true;
}

/* ---------- medication logic ---------- */
function schedText(m) {
  if (m.freq === 'weekly') { return 'Weekly, ' + DOWFULL[m.weekday]; }
  if (m.freq === 'twice') { return 'Twice a day, AM and night'; }
  if (m.freq === 'night') { return 'Daily, at night'; }
  return 'Daily';
}
function medDue(m, date) {
  if (date < m.start) { return false; }
  if (m.removedOn && date >= m.removedOn) { return false; }
  if (m.freq === 'weekly') { return parseDate(date).getDay() === m.weekday; }
  return true;
}
function dueItems(date) {
  var out = [], i, j, m, slots;
  for (i = 0; i < state.meds.length; i++) {
    m = state.meds[i];
    if (!medDue(m, date)) { continue; }
    slots = m.freq === 'twice' ? ['AM', 'Night'] : (m.freq === 'night' ? ['Night'] : ['']);
    for (j = 0; j < slots.length; j++) {
      out.push({
        key: m.id + '|' + slots[j],
        name: m.name,
        strength: m.strength,
        slot: slots[j],
        freq: m.freq,
        label: m.name + (slots[j] ? ' (' + slots[j] + ')' : '')
      });
    }
  }
  return out;
}
function missedList(date) {
  var due = dueItems(date), day = state.days[date], taken = day ? day.taken : {}, out = [], i;
  for (i = 0; i < due.length; i++) {
    if (!taken[due[i].key]) { out.push(due[i].label); }
  }
  return out;
}
function missedText(date) {
  var m = missedList(date);
  var prefix = date < todayStr() ? 'Missed: ' : 'Not yet checked: ';
  if (!m.length) { return 'All meds taken'; }
  if (date >= todayStr() && m.length === dueItems(date).length) { return 'Meds not checked off yet'; }
  return prefix + m.join(', ');
}

/* ---------- optional Home Assistant reminder link ----------
   Sends ONLY today's done / not done flags (no numbers, no medication names) to a private
   webhook address that is stored on this phone, never in this file and never in backups.
   Fire and forget: if the phone is offline nothing is sent and the reminders simply keep going. */
var HAKEY = 'vitalsLog.haUrl';
/* Backup file numbering: its own counter on this phone (not part of the data, so imports never reset it). */
var BNKEY = 'vitalsLog.backupNo';
function backupNo() { try { return parseInt(localStorage.getItem(BNKEY) || '0', 10) || 0; } catch (e) { return 0; } }
function nextBackupNo() {
  var n = backupNo() + 1;
  try { localStorage.setItem(BNKEY, String(n)); } catch (e) { /* ignore: file is still named with the number */ }
  return n;
}
function haGet() { try { return localStorage.getItem(HAKEY) || ''; } catch (e) { return ''; } }
function haSet(v) {
  try { if (v) { localStorage.setItem(HAKEY, v); } else { localStorage.removeItem(HAKEY); } return true; } catch (e) { return false; }
}
function haUrlOk(v) { return /^https:\/\/[^\s]+$/.test(v) || /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?(\/[^\s]*)?$/.test(v); }
function haStatus() {
  var d = todayStr(), items = dueItems(d), day = state.days[d], taken = day ? day.taken : {};
  var c = { am: [0, 0], night: [0, 0], weekly: [0, 0] }, i, k, bpAm = false, bpPm = false, r;
  for (i = 0; i < state.readings.length; i++) {
    r = state.readings[i];
    if (r.date === d) { if (r.period === 'PM') { bpPm = true; } else { bpAm = true; } }
  }
  for (i = 0; i < items.length; i++) {
    k = items[i].freq === 'weekly' ? 'weekly' : (items[i].slot === 'Night' ? 'night' : 'am');
    c[k][0]++;
    if (taken[items[i].key]) { c[k][1]++; }
  }
  function f(x) { return x[0] === 0 ? 'na' : (x[0] === x[1] ? 'yes' : 'no'); }
  return { date: d, bp_am: bpAm ? 'yes' : 'no', bp_pm: bpPm ? 'yes' : 'no', meds_am: f(c.am), meds_night: f(c.night), meds_weekly: f(c.weekly) };
}
function haPing() {
  var url = haGet(), s, body, x;
  if (!url || !state) { return false; }
  s = haStatus();
  body = 'date=' + s.date + '&bp_am=' + s.bp_am + '&bp_pm=' + s.bp_pm + '&meds_am=' + s.meds_am + '&meds_night=' + s.meds_night + '&meds_weekly=' + s.meds_weekly;
  try {
    if (window.fetch) {
      fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })['catch'](function () { /* offline: ignore */ });
    } else {
      x = new XMLHttpRequest();
      x.open('POST', url, true);
      x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      x.onerror = function () { /* offline: ignore */ };
      x.send(body);
    }
  } catch (e) { return false; }
  return true;
}

/* ---------- reading / stats helpers ---------- */
function findReading(id) {
  var i;
  for (i = 0; i < state.readings.length; i++) { if (state.readings[i].id === id) { return state.readings[i]; } }
  return null;
}
function readingsOn(date) {
  var out = [], i;
  for (i = 0; i < state.readings.length; i++) { if (state.readings[i].date === date) { out.push(state.readings[i]); } }
  out.sort(function (a, b) { return (a.time || '') < (b.time || '') ? -1 : ((a.time || '') > (b.time || '') ? 1 : 0); });
  return out;
}
function allDates() {
  var set = {}, out = [], i, k;
  for (i = 0; i < state.readings.length; i++) { set[state.readings[i].date] = 1; }
  for (k in state.days) { if (state.days.hasOwnProperty(k)) { set[k] = 1; } }
  for (k in set) { if (set.hasOwnProperty(k)) { out.push(k); } }
  out.sort();
  return out;
}
function avgRound(sum, n) { return n ? Math.round(sum / n) : null; }
function stats(from, to) {
  var r = { n: 0, sys: null, dia: null, pulse: null, sleepN: 0, sleep: null };
  var ss = 0, sd = 0, sp = 0, i, k, sl = 0;
  for (i = 0; i < state.readings.length; i++) {
    var x = state.readings[i];
    if (x.date >= from && x.date <= to) { r.n++; ss += x.sys; sd += x.dia; sp += x.pulse; }
  }
  for (k in state.days) {
    if (state.days.hasOwnProperty(k) && k >= from && k <= to && state.days[k].sleepMinutes !== null && state.days[k].sleepMinutes !== undefined) {
      r.sleepN++; sl += state.days[k].sleepMinutes;
    }
  }
  r.sys = avgRound(ss, r.n); r.dia = avgRound(sd, r.n); r.pulse = avgRound(sp, r.n); r.sleep = avgRound(sl, r.sleepN);
  return r;
}
function timeText(r) { return r.time ? r.time + ' ' + r.period : r.period; }
function dash(v) { return v === null || v === undefined ? '—' : v; }
function lbText(v) { return v === null || v === undefined ? '—' : v.toFixed(1); }
function findWeight(id) {
  var i;
  for (i = 0; i < state.weights.length; i++) { if (state.weights[i].id === id) { return state.weights[i]; } }
  return null;
}
function weightsSorted(from, to, newestFirst) {
  var out = [], i;
  for (i = 0; i < state.weights.length; i++) { if (state.weights[i].date >= from && state.weights[i].date <= to) { out.push(state.weights[i]); } }
  out.sort(function (a, b) {
    var ka = a.date + ' ' + (a.time || ''), kb = b.date + ' ' + (b.time || '');
    var c = ka < kb ? -1 : (ka > kb ? 1 : 0);
    return newestFirst ? -c : c;
  });
  return out;
}
function weightStats(from, to) {
  var ws = weightsSorted(from, to, false), sum = 0, i;
  for (i = 0; i < ws.length; i++) { sum += ws[i].lb; }
  return { n: ws.length, avg: ws.length ? Math.round(sum / ws.length * 10) / 10 : null };
}

/* ---------- messages / modal ---------- */
function setErr(msg) {
  var e = $('err');
  if (e) { e.textContent = msg; e.style.display = 'block'; e.scrollIntoView(); }
  else { flashMsg = msg; }
}
function go(v, msg) {
  view = v;
  flashMsg = msg || '';
  render();
}
function askConfirm(text, yesLabel, fn) {
  pendingConfirm = fn;
  $('modalbox').innerHTML = '<div>' + esc(text) + '</div>' +
    '<button class="danger" data-act="confirmYes">' + esc(yesLabel) + '</button>' +
    '<button class="sec" data-act="confirmNo">Cancel</button>';
  $('modal').style.display = 'flex';
}
function closeModal() { $('modal').style.display = 'none'; pendingConfirm = null; }

/* ---------- views ---------- */
function viewError() {
  var h = '<h1>Vitals Log</h1><div class="err" style="display:block">' + esc(loadError) + '</div>';
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  if (raw !== null) { h += '<button data-act="rawBackup">Save a copy of the stored data</button>'; }
  return h;
}

function viewLog() {
  var r = editReadingId ? findReading(editReadingId) : null;
  if (editReadingId && !r) { editReadingId = null; }
  var t = r ? r.time : nowTime();
  var d = r ? r.date : todayStr();
  var p = r ? r.period : periodFor(t);
  var h = '<h1>' + (r ? 'Edit reading' : 'Log reading') + '</h1>';
  if (!r && !state.readings.length && !state.meds.length && !countKeys(state.days)) {
    h += '<div class="warn">First time here? To load your saved data and medication list: More, then Backup, then Import.</div>';
  }
  h += '<div class="err" id="err"></div>';
  if (!r) {
    h += '<div class="fld f4"><label for="r-lb">Weight in pounds (optional)</label><input class="big" id="r-lb" type="text" inputmode="decimal" maxlength="6" autocomplete="off" value=""></div>';
  }
  h += '<div class="fld f1"><label for="r-sys">Top number (systolic)</label><input class="big" id="r-sys" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="' + (r ? r.sys : '') + '"></div>';
  h += '<div class="fld f2"><label for="r-dia">Bottom number (diastolic)</label><input class="big" id="r-dia" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="' + (r ? r.dia : '') + '"></div>';
  h += '<div class="fld f3"><label for="r-pul">Pulse (beats per minute)</label><input class="big" id="r-pul" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" value="' + (r ? r.pulse : '') + '"></div>';
  h += '<label for="r-notes">Notes (optional)</label><textarea id="r-notes">' + esc(r ? r.notes : '') + '</textarea>';
  h += '<button class="go" data-act="saveReading">' + (r ? 'Save changes' : 'Save reading') + '</button>';
  if (r) {
    h += '<button class="sec" data-act="cancelEdit">Cancel</button>';
    h += '<button class="danger" data-act="deleteReading">Delete this reading</button>';
  }

function doSaveReading() {
  var r = editReadingId ? findReading(editReadingId) : null;
  var sysS = $('r-sys').value.replace(/\s/g, ''), diaS = $('r-dia').value.replace(/\s/g, ''), pulS = $('r-pul').value.replace(/\s/g, '');
  var anyBp = (sysS !== '' || diaS !== '' || pulS !== '');
  var lbEl = $('r-lb'), lbS = lbEl ? lbEl.value.replace(/\s/g, '').replace(',', '.') : '';
  var date = $('r-date').value, time = $('r-time').value, period = $('r-period').value, notes = $('r-notes').value;
  var sys = null, dia = null, pul = null, lb = null, msg = [];
  if (!r && !anyBp && lbS === '') { setErr('Enter your blood pressure, your weight, or both.'); return; }
  if (r || anyBp) {
    sys = readInt(sysS); dia = readInt(diaS); pul = readInt(pulS);
    if (sys === null || dia === null || pul === null) { setErr('Enter all three blood pressure numbers (whole numbers, 1 to 999).'); return; }
  }
  if (lbS !== '') {
    if (!/^\d{2,3}(\.\d)?$/.test(lbS)) { setErr('Enter your weight in pounds, like 215.4'); return; }
    lb = parseFloat(lbS);
    if (lb < 50 || lb > 999) { setErr('That weight looks wrong. Enter it in pounds, like 215.4'); return; }
  }
  if (!date) { setErr('Pick a date.'); return; }
  if (r) {
    r.date = date; r.time = time; r.period = period; r.sys = sys; r.dia = dia; r.pulse = pul; r.notes = notes;
    if (save()) { editReadingId = null; go('history', 'Changes saved.'); }
    return;
  }
  if (anyBp) {
    state.readings.push({ id: newId('r'), date: date, time: time, period: period, sys: sys, dia: dia, pulse: pul, notes: notes });
    msg.push(sys + '/' + dia + ', pulse ' + pul);
  }
  if (lb !== null) {
    state.weights.push({ id: newId('w'), date: date, time: time, lb: lb, notes: anyBp ? '' : notes });
    msg.push(lb.toFixed(1) + ' lb');
  }
  if (save()) { go('log', 'Saved ' + msg.join(' and ') + '.'); }
}

function doSaveDay() {
  var hv = $('d-h').value.replace(/\s/g, ''), mv = $('d-m').value.replace(/\s/g, ''), ev = $('d-e').value.replace(/\s/g, '').replace(',', '.');
  var sleep = null, events = null, taken = {}, boxes = document.querySelectorAll('input[data-key]'), i;
  if (hv !== '' || mv !== '') {
    if (!/^\d{1,2}$/.test(hv === '' ? '0' : hv) || !/^\d{1,2}$/.test(mv === '' ? '0' : mv)) { setErr('Sleep hours and minutes must be whole numbers.'); return; }
    var hn = hv === '' ? 0 : parseInt(hv, 10), mn = mv === '' ? 0 : parseInt(mv, 10);
    if (mn > 59) { setErr('Minutes must be 0 to 59.'); return; }
    sleep = hn * 60 + mn;
  }
  if (ev !== '') {
    if (!/^\d+(\.\d+)?$/.test(ev)) { setErr('Sleep events per hour must be a number like 2.6.'); return; }
    events = parseFloat(ev);
  }
  for (i = 0; i < boxes.length; i++) { if (boxes[i].checked) { taken[boxes[i].getAttribute('data-key')] = true; } }
  state.days[todayDate] = { sleepMinutes: sleep, eventsPerHour: events, taken: taken, notes: $('d-notes').value };
  if (save()) { go('today', 'Saved ' + longDate(todayDate) + '.'); }
}

function doSaveMed() {
  var name = $('md-name').value.replace(/^\s+|\s+$/g, '');
  if (!name) { setErr('Enter a name.'); return; }
  var m = null, i;
  if (editMedId) { for (i = 0; i < state.meds.length; i++) { if (state.meds[i].id === editMedId) { m = state.meds[i]; } } }
  var fields = { name: name, strength: $('md-strength').value, freq: $('md-freq').value, weekday: parseInt($('md-wd').value, 10), type: $('md-type').value };
  if (m) {
    m.name = fields.name; m.strength = fields.strength; m.freq = fields.freq; m.weekday = fields.weekday; m.type = fields.type;
  } else {
    fields.id = newId('m'); fields.start = todayStr(); fields.removedOn = '';
    state.meds.push(fields);
  }
  if (save()) { editMedId = null; go('meds', 'Medication saved.'); }
}

function csvCell(v) {
  var s = String(v === null || v === undefined ? '' : v);
  if (/[",\n\r]/.test(s)) { s = '"' + s.replace(/"/g, '""') + '"'; }
  return s;
}
function csvLine(a) { var o = [], i; for (i = 0; i < a.length; i++) { o.push(csvCell(a[i])); } return o.join(','); }

function buildCsv() {
  var lines = [], dates = allDates(), i, d, day, rs = state.readings.slice();
  lines.push(csvLine(['READINGS']));
  lines.push(csvLine(['Date', 'Time', 'AM/PM', 'Systolic (top)', 'Diastolic (bottom)', 'Pulse', 'Notes']));
  rs.sort(function (a, b) { var ka = a.date + ' ' + (a.time || ''), kb = b.date + ' ' + (b.time || ''); return ka < kb ? -1 : (ka > kb ? 1 : 0); });
  for (i = 0; i < rs.length; i++) { lines.push(csvLine([rs[i].date, rs[i].time, rs[i].period, rs[i].sys, rs[i].dia, rs[i].pulse, rs[i].notes])); }
  lines.push('');
  lines.push(csvLine(['WEIGHT']));
  lines.push(csvLine(['Date', 'Time', 'Weight (lb)', 'Notes']));
  var wl = weightsSorted('', '9999-12-31', false);
  for (i = 0; i < wl.length; i++) { lines.push(csvLine([wl[i].date, wl[i].time, wl[i].lb.toFixed(1), wl[i].notes])); }
  lines.push('');
  lines.push(csvLine(['DAILY']));
  lines.push(csvLine(['Date', 'Sleep (h:mm)', 'Sleep events per hour', 'Missed meds', 'Notes']));
  for (i = 0; i < dates.length; i++) {
    d = dates[i]; day = state.days[d];
    lines.push(csvLine([d, day && day.sleepMinutes !== null && day.sleepMinutes !== undefined ? hm(day.sleepMinutes) : '', day && day.eventsPerHour !== null && day.eventsPerHour !== undefined ? day.eventsPerHour : '', missedText(d), day ? day.notes : '']));
  }
  lines.push('');
  lines.push(csvLine(['MEDICATIONS']));
  lines.push(csvLine(['Medication', 'Strength', 'Schedule', 'Type']));
  for (i = 0; i < state.meds.length; i++) {
    if (state.meds[i].removedOn && state.meds[i].removedOn <= todayStr()) { continue; }
    lines.push(csvLine([state.meds[i].name, state.meds[i].strength, schedText(state.meds[i]), state.meds[i].type]));
  }
  return '﻿' + lines.join('\r\n') + '\r\n';
}

function download(name, text, type) {
  var blob = new Blob([text], { type: type });
  var a = document.createElement('a');
  var url = (window.URL || window.webkitURL).createObjectURL(blob);
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); (window.URL || window.webkitURL).revokeObjectURL(url); }, 1500);
}

function handleImportFile(file) {
  var rd = new FileReader();
  rd.onload = function () {
    var obj;
    try { obj = JSON.parse(rd.result); } catch (e) { go('backup'); setErr('That file is not valid JSON. Nothing was changed.'); return; }
    if (!validState(obj)) { go('backup'); setErr('That file is not a Vitals Log backup. Nothing was changed.'); return; }
    if (!obj.profile) { obj.profile = { name: '' }; }
    if (!(obj.weights instanceof Array)) { obj.weights = []; }
    var nr = obj.readings.length, nd = countKeys(obj.days), nw = obj.weights.length;
    if (nr === 0 && nd === 0 && nw === 0 && (state.readings.length > 0 || countKeys(state.days) > 0 || state.weights.length > 0)) {
      go('backup'); setErr('That backup is empty, so it was NOT imported. Your data is unchanged.'); return;
    }
    askConfirm('Replace everything on this phone with the file? File has ' + nr + ' readings, ' + nw + ' weights and ' + nd + ' daily entries. This phone has ' + state.readings.length + ' readings, ' + state.weights.length + ' weights and ' + countKeys(state.days) + ' daily entries. A copy of the current data is kept first.', 'Yes, import', function () {
      try { localStorage.setItem(PREV, JSON.stringify(state)); } catch (e2) { go('backup'); setErr('Could not keep a copy of the current data, so nothing was imported.'); return; }
      state = obj;
      if (save()) { go('backup', 'Imported ' + nr + ' readings, ' + nw + ' weights and ' + nd + ' daily entries.'); }
    });
  };
  rd.onerror = function () { go('backup'); setErr('Could not read that file. Nothing was changed.'); };
  rd.readAsText(file);
}

/* ---------- events ---------- */
function actOf(el) {
  while (el && el !== document) {
    if (el.getAttribute && el.getAttribute('data-act')) { return el; }
    el = el.parentNode;
  }
  return null;
}

document.addEventListener('click', function (ev) {
  var el = actOf(ev.target);
  if (!el) { return; }
  var act = el.getAttribute('data-act');
  if (act === 'confirmYes') { var fn = pendingConfirm; closeModal(); if (fn) { fn(); } return; }
  if (act === 'confirmNo') { closeModal(); return; }
  if (act === 'rawBackup') {
    var raw = ''; try { raw = localStorage.getItem(KEY) || ''; } catch (e) { raw = ''; }
    download('vitals-log-raw-' + todayStr() + '.txt', raw, 'text/plain'); return;
  }
  if (!state) { return; }
  if (act === 'nav') {
    editReadingId = null; editMedId = null; editWeightId = null; todayDate = null;
    go(el.getAttribute('data-v'));
  }
  else if (act === 'saveWeight') { doSaveWeight(); }
  else if (act === 'cancelWeight') { editWeightId = null; go('history'); }
  else if (act === 'editWeight') { editWeightId = el.getAttribute('data-id'); go('weight'); }
  else if (act === 'deleteWeight') {
    askConfirm('Delete this weight? This cannot be undone.', 'Yes, delete', function () {
      var i;
      for (i = 0; i < state.weights.length; i++) { if (state.weights[i].id === editWeightId) { state.weights.splice(i, 1); break; } }
      if (save()) { editWeightId = null; go('history', 'Weight deleted.'); }
    });
  }
  else if (act === 'go-meds') { go('meds'); }
  else if (act === 'go-report') { go('report'); }
  else if (act === 'go-backup') { go('backup'); }
  else if (act === 'saveReading') { doSaveReading(); }
  else if (act === 'cancelEdit') { editReadingId = null; go('history'); }
  else if (act === 'editReading') { editReadingId = el.getAttribute('data-id'); go('log'); }
  else if (act === 'deleteReading') {
    askConfirm('Delete this reading? This cannot be undone.', 'Yes, delete', function () {
      var i;
      for (i = 0; i < state.readings.length; i++) { if (state.readings[i].id === editReadingId) { state.readings.splice(i, 1); break; } }
      if (save()) { editReadingId = null; go('history', 'Reading deleted.'); }
    });
  }
  else if (act === 'openDay') { todayDate = el.getAttribute('data-date'); go('today'); }
  else if (act === 'saveDay') { doSaveDay(); }
  else if (act === 'deleteDay') {
    askConfirm('Clear sleep and meds for ' + longDate(todayDate) + '? Readings stay. This cannot be undone.', 'Yes, clear', function () {
      delete state.days[todayDate];
      if (save()) { go('today', 'Cleared.'); }
    });
  }
  else if (act === 'addMed') { editMedId = null; go('medEdit'); }
  else if (act === 'editMed') { editMedId = el.getAttribute('data-id'); go('medEdit'); }
  else if (act === 'saveMed') { doSaveMed(); }
  else if (act === 'removeMed') {
    askConfirm('Remove this medication from the daily checklist? Past history is kept.', 'Yes, remove', function () {
      var i;
      for (i = 0; i < state.meds.length; i++) { if (state.meds[i].id === editMedId) { state.meds[i].removedOn = todayStr(); } }
      if (save()) { editMedId = null; go('meds', 'Medication removed.'); }
    });
  }
  else if (act === 'exportJson') {
    var bn = nextBackupNo();
    download('vitals-log-backup-' + (bn < 100 ? (bn < 10 ? '00' : '0') : '') + bn + '_' + todayStr() + '.json', JSON.stringify(state, null, 2), 'application/json');
    go('backup', 'Backup #' + bn + ' saved. Keep the newest two in OneDrive.');
  }
  else if (act === 'exportCsv') { download('vitals-log-' + todayStr() + '.csv', buildCsv(), 'text/csv'); }
  else if (act === 'pickFile') { $('import-file').value = ''; $('import-file').click(); }
  else if (act === 'haSave') {
    var hv = $('ha-url').value.replace(/^\s+|\s+$/g, '');
    if (!hv) { setErr('Paste the link first.'); return; }
    if (!haUrlOk(hv)) { setErr('The link must start with https://'); return; }
    if (haSet(hv)) { haPing(); go('backup', 'Reminder link saved, and today\'s status was sent.'); } else { setErr('Could not save the link on this phone.'); }
  }
  else if (act === 'haTest') {
    if (haPing()) { go('backup', 'Sent. This phone cannot see Home Assistant\'s reply, so check Home Assistant to confirm it arrived.'); } else { setErr('No link is set.'); }
  }
  else if (act === 'haRemove') {
    askConfirm('Remove the Home Assistant reminder link from this phone? Reminders will no longer know what you have logged.', 'Yes, remove', function () {
      haSet(''); go('backup', 'Reminder link removed.');
    });
  }
  else if (act === 'print') { window.print(); }
});

document.addEventListener('change', function (ev) {
  var t = ev.target, id = t.id;
  if (id === 'import-file') { if (t.files && t.files[0] && state) { handleImportFile(t.files[0]); } return; }
  if (!state) { return; }
  if (t.getAttribute('data-key')) { t.parentNode.className = 'chk' + (t.checked ? ' on' : ''); }
  else if (id === 'r-time') { $('r-period').value = periodFor(t.value); }
  else if (id === 'd-date') { if (t.value) { todayDate = t.value; render(); } }
  else if (id === 'md-freq') { $('md-wdwrap').style.display = t.value === 'weekly' ? '' : 'none'; }
  else if (id === 'rp-range') { reportRange = t.value; render(); }
  else if (id === 'rp-name') { state.profile.name = t.value; save(); render(); }
});

/* ---------- start ---------- */
load();
render();
haPing(); /* re-send today's status on every open, so a ping missed while offline is caught up */
try { if (navigator.storage && navigator.storage.persist) { navigator.storage.persist(); } } catch (e) { /* ignore */ }
if ('serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js'); } catch (e2) { /* ignore */ }
}
})();
</script>
</body>
